# Builds what macOS and Linux players download (tooling/release/build_release.sh)
# on GitHub's runners. Run it by hand from the Actions tab (the packages are
# then the run's artifacts; release_tag attaches to an existing release),
# or push a release tag (alpha-v<version>): the
# packages are then attached to that tag's GitHub release, made as a draft
# when there is none. Windows' installer and the server package are built
# locally (tooling/release/build_release.ps1).
name: Release (macOS, Linux)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to rebuild
        type: choice
        options: [all, macos, linux]
        default: all
      release_tag:
        description: Existing release tag to receive this build (blank keeps artifacts only)
        type: string
        default: ''
  push:
    tags: ["alpha-v*"]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Ubuntu 22.04 preserves the release's oldest supported glibc baseline.
      matrix:
        include: ${{ fromJSON(inputs.platform == 'macos' && '[{"os":"macos-15","platform":"macos"}]' || inputs.platform == 'linux' && '[{"os":"ubuntu-22.04","platform":"linux"}]' || '[{"os":"macos-15","platform":"macos"},{"os":"ubuntu-22.04","platform":"linux"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the repair destination
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
        run: |
          version=$(sed -n 's/^project(golfpp VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt)
          test "$TAG" = "alpha-v$version"
          gh release view "$TAG" > /dev/null

      - name: Install build tools (Linux)
        if: matrix.platform == 'linux'
        # SDL2's development files are only for building it: it loads them
        # at run time.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libssl-dev libdbus-1-dev \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev

      - name: Install build tools (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install ninja
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache the native libraries
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: build/deps
          key: deps-${{ matrix.os }}-${{ hashFiles('tooling/release/build_deps.sh') }}

      - name: Build the native libraries
        if: steps.deps-cache.outputs.cache-hit != 'true'
        env:
          CMAKE_OSX_ARCHITECTURES: ${{ matrix.platform == 'macos' && 'arm64;x86_64' || '' }}
          CMAKE_OSX_DEPLOYMENT_TARGET: ${{ matrix.platform == 'macos' && '11.0' || '' }}
        run: bash tooling/release/build_deps.sh build/deps

      - name: Build the release
        run: bash tooling/release/build_release.sh build/deps

      - name: Show what the game loads from the system
        run: |
          if [ "${{ matrix.platform }}" = macos ]; then
            otool -L build/dist/golfpp-*/golf++.app/Contents/MacOS/golf++
            lipo -info build/dist/golfpp-*/golf++.app/Contents/MacOS/golf++
          else
            ldd build/dist/golfpp-*/golf++
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: golfpp-${{ matrix.platform }}
          path: |
            build/dist/*.dmg
            build/dist/*.tar.gz
          if-no-files-found: error

      - name: Attach this platform's package to the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$MANUAL_TAG" ]; then
            gh release view "$TAG" > /dev/null
          elif ! gh release view "$TAG" > /dev/null 2>&1; then
            # The other platform may have created it since our view.
            gh release create "$TAG" --draft --verify-tag --title "Alpha v${TAG#alpha-v}" --notes "" || gh release view "$TAG" > /dev/null
          fi
          gh release upload "$TAG" build/dist/*.${{ matrix.platform == 'macos' && 'dmg' || 'tar.gz' }} --clobber
