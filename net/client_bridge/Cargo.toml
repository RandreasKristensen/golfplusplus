[package]
name = "golfpp_client_bridge"
version = "0.1.0"
edition = "2021"
publish = false
description = "golf++'s connection to its SpacetimeDB server, behind a small C API (src/net/stdb_bridge.h)."

[lib]
crate-type = ["staticlib"]

[dependencies]
spacetimedb-sdk = "=2.10.2"
oauth2 = { version = "5", default-features = false, features = ["reqwest-blocking", "rustls-tls"] }
open = "5"
serde = { version = "1", features = ["derive"] }

# The refresh token's store: Windows Credential Manager, the macOS Keychain,
# the Secret Service (GNOME Keyring, KWallet) on Linux.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
panic = "abort"
